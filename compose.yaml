name: best_doctor
x-app: &app
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media-data:/app/media
services:
  db:
    image: postgres:19
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - "127.0.0.1:${BEST_DOCTOR_WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: celery -A best_doctor worker --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
  beat:
    <<: *app
    command: celery -A best_doctor beat --loglevel=INFO --schedule=/tmp/best_doctor-beat
    depends_on:
      worker:
        condition: service_started
volumes:
  db-data:
  media-data:
